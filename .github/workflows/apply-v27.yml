name: Apply Ithaca v27

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v27.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build v27 index
        run: |
          cat .tmp_v27/part1.b64 .tmp_v27/p2a.b64 .tmp_v27/p2b.b64 .tmp_v27/p2c.b64 .tmp_v27/p2d.b64 .tmp_v27/p2e.b64 .tmp_v27/part3.b64 .tmp_v27/part4.b64 | base64 -d | gzip -d > index.html
          rm -rf .tmp_v27
          rm -f .github/workflows/apply-v27.yml

      - name: Commit v27
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Ithaca simulator v27"
          git push
