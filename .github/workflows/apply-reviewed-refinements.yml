name: Apply reviewed Ithaca refinements

on:
  push:
    paths:
      - '.github/workflows/apply-reviewed-refinements.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed patch
        run: python .ithaca_patch.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          Path('/tmp/ithaca.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/ithaca.js
      - name: Commit index update
        run: |
          git config user.name "Mule"
          git config user.email "lic960920@gmail.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Reapply reviewed Ithaca simulator refinements"
          git push
