name: Unify longest time

on:
  push:
    branches: [main]
    paths: ['.github/workflows/unify-longest-time.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update longest-time summary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const goalRows=D.items.filter(i=>i.stage>0).map(i=>({i,remaining:stock(i.id)+t[i.id].out-req.gross[i.id],need:req.need[i.id],h:timeToAmount(i.id,req.need[i.id])})),goalShort=goalRows.filter(x=>x.remaining<0),goalShortValues=goalShort.length?goalShort.map(x=>x.i.name):['없음'],times=goalRows.map(x=>x.h),maxT=times.some(v=>v===null)?null:Math.max(...times),reach=maxLevel(t,c);metrics('goalSummary',[['최대 도달(자원 기준)','Lv.'+reach],['부족 항목',goalShortValues,'metric-wide2'],['예상 생산 시간',time(maxT)]])"
          new="const goalRows=D.items.filter(i=>i.stage>0).map(i=>({i,remaining:stock(i.id)+t[i.id].out-req.gross[i.id],need:req.need[i.id],h:timeToAmount(i.id,req.need[i.id])})),goalShort=goalRows.filter(x=>x.remaining<0),goalShortValues=goalShort.length?goalShort.map(x=>x.i.name):['없음'],goalNeeded=goalRows.filter(x=>x.need>1e-8);let goalSlowValue=['없음'];if(goalNeeded.length){const unresolved=goalNeeded.find(x=>x.h===null);if(unresolved)goalSlowValue=[[unresolved.i.name,'생산 설정 확인']];else{const x=goalNeeded.reduce((a,b)=>b.h>a.h?b:a);goalSlowValue=[[x.i.name,time(x.h)]]}}const reach=maxLevel(t,c);metrics('goalSummary',[['최대 도달(자원 기준)','Lv.'+reach],['부족 항목',goalShortValues,'metric-wide2'],['최장 소요',goalSlowValue]])"
          if old not in s:
              raise SystemExit('target snippet not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/unify-longest-time.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify wonder longest-time summary"
          git push
